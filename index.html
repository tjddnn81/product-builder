<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-switcher">
        <button id="light-mode-btn">라이트 모드</button>
        <button id="dark-mode-btn">다크 모드</button>
    </div>
    <div class="container">
        <h1>로또 번호 생성기</h1>
        <div class="numbers" id="numbers-container">
            <!-- 번호가 여기에 생성됩니다 -->
        </div>
        <button id="generate-btn">번호 생성</button>
    </div>

    <div class="container partnership-form">
        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/xlgnrgna" method="POST">
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>
            <label for="message">내용:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            <button type="submit">문의하기</button>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
